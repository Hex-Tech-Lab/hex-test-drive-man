name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Mondays at 9:00 UTC
    - cron: '0 9 * * 1'

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true
        
      - name: Run ESLint security checks
        run: pnpm run lint:security
        continue-on-error: true
        
      - name: Check for known vulnerabilities
        run: |
          echo "Checking for high/critical vulnerabilities..."
          pnpm audit --audit-level=high --json > audit-results.json || true
          
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-results
          path: audit-results.json
          retention-days: 30
          
  python-security:
    name: Python Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install safety bandit
          
      - name: Run Safety check
        run: |
          cd extraction_engine
          safety check -r requirements.txt --json > ../python-safety-results.json || true
        continue-on-error: true
        
      - name: Run Bandit security linter
        run: |
          bandit -r extraction_engine/ -f json -o bandit-results.json || true
        continue-on-error: true
        
      - name: Upload Python security results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-results
          path: |
            python-safety-results.json
            bandit-results.json
          retention-days: 30
